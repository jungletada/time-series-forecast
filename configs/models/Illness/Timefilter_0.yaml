dropout: 0.1
d_model: 128
e_layers: 3
d_layers: 1
d_ff: 512
patch_len: 36
use_norm: 1
top_p: 0.0
factor: 3
learning_rate: 0.015
lradj: cosine

# optimization
des: test
loss: MSE
use_amp: false        # 对应 action='store_true'

# GCN
node_dim: 10
gcn_depth: 2
gcn_dropout: 0.3
propalpha: 0.3
conv_channel: 32
skip_channel: 32
individual: false      # 对应 action='store_true'


